[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = false
ast = true
extra_output = ["storageLayout"]

# Deterministic bytecode: no trailing metadata hash, so a rebuild is byte-identical and the
# deployed runtime code can be compared with the reviewed source. Do not change these two lines.
bytecode_hash = "none"
cbor_metadata = false

# Hermetic by default: no test can shell out and there is no default RPC. The fork tests take their
# URL from SWORN_FORK_RPC explicitly and skip when it is unset.
ffi = false

fs_permissions = [
    { access = "read", path = "./template" },
    { access = "read", path = "./templates/fixtures" },
    { access = "read", path = "./test/fixtures" },
    { access = "read", path = "./out" },
    { access = "read", path = "./reference/attestations" },
    { access = "read", path = "./reference/intake" },
    { access = "read", path = "./reference/plane" },
]

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
